<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Voice Generator</title>
<link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header class="app-header">
    <h1>Voice Generator</h1>
    <div class="header-controls">
      <label>
        Voice
        <select id="voice-select"></select>
      </label>
      <label>
        Pace
        <select id="speed-select">
          <option value="0.75">0.75x (Slower)</option>
          <option value="0.9">0.9x</option>
          <option value="1.0" selected>1.0x (Normal)</option>
          <option value="1.15">1.15x</option>
          <option value="1.3">1.3x (Faster)</option>
        </select>
      </label>
      <label>
        Expressiveness
        <select id="exaggeration-select">
          <option value="0.4">Calm</option>
          <option value="0.5" selected>Normal</option>
          <option value="0.7">Expressive</option>
          <option value="0.9">Very expressive</option>
        </select>
      </label>
    </div>
  </header>

  <main class="app-main">
    <div id="error-banner" class="error-banner" hidden></div>

    <section class="script-area">
      <label for="script-input" class="script-label">Script text</label>
      <textarea
        id="script-input"
        class="script-input"
        placeholder="Paste or type the narration script you want spoken in the selected voice…"
        maxlength="5000"
      ></textarea>
      <div class="script-footer">
        <span id="char-count" class="char-count">0 / 5000</span>
        <button id="generate-button" class="generate-button" type="button">Generate</button>
      </div>
    </section>

    <section id="result-area" class="result-area" hidden>
      <h2>Result</h2>
      <audio id="player" controls></audio>
      <div class="result-meta">
        <span id="result-stats"></span>
        <a id="download-link" class="download-link" download>Download WAV</a>
      </div>
    </section>
  </main>

  <script src="app.js"></script>
</body>
</html>
